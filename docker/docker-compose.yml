services:
  postgres:
    image: postgres:16-alpine
    container_name: merchantmcc_postgres
    env_file: ../.env
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - merchantmcc_postgres_data:/var/lib/postgresql/data
    networks:
      - merchantmcc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  merchantmcc_postgres_data:
    name: merchantmcc_postgres_data

networks:
  merchantmcc_net:
    name: merchantmcc_net
